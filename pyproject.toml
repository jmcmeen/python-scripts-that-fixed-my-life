[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lifefixer"
version = "0.0.2"
description = "324,098,502,198,153,092,815,098 Python scripts that will fix your life. 8 shipped. The rest are on the roadmap."
readme = "README.md"
requires-python = ">=3.9"
license = "CC0-1.0"
authors = [{ name = "John McMeen", email = "johnmcmeen@gmail.com" }]
keywords = ["productivity", "automation", "life", "scripts", "synergy"]

# The headline product installs in milliseconds. This is not a limitation. It
# is modular by design. Capability-specific dependencies are delivered as
# optional extras so you only pay for the life you are fixing.
dependencies = []

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Other Audience",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
    "Topic :: Utilities",
    "Natural Language :: English",
]

[project.optional-dependencies]
# Script #44,999 reads a CSV. Reading a CSV is a discovery on the order of fire
# and is therefore gated behind an extra.
the-script = ["pandas>=2.0"]
# Script #788,212 signals deep work to Slack, briefly, before Slack ends it.
deep-work = ["requests>=2.0"]
# Engineering productivity tooling. Used to verify that os.rename renames.
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/jmcmeen/python-scripts-that-fixed-my-life"
Changelog = "https://github.com/jmcmeen/python-scripts-that-fixed-my-life/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/jmcmeen/python-scripts-that-fixed-my-life/blob/main/ROADMAP.md"

# Each script is delivered as a first-class, individually addressable command-
# line binary. Scripts are named by catalog number, not by function. Function
# is an implementation detail.
[project.scripts]
script-1 = "lifefixer.script_00001:main"
script-2 = "lifefixer.script_00002:main"
script-8003 = "lifefixer.script_08003:main"
script-44999 = "lifefixer.script_44999:main"
script-45001 = "lifefixer.script_45001:main"
script-102847 = "lifefixer.script_102847:main"
script-788212 = "lifefixer.script_788212:main"
script-324098502198153092815097 = "lifefixer.script_324098502198153092815097:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lifefixer"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# We are extremely serious about code quality in scripts that are three lines
# long. The verbatim payloads are exempt where the article's voice requires it.
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
